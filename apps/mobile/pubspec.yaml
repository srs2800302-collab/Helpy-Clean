name: helpy_mobile
description: Helpy independent mobile foundation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  fpdart: ^1.1.1
  shared_preferences: ^2.5.3
  helpy_contracts:
    path: ../../packages/contracts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/helpy_contracts/src/catalog.json
