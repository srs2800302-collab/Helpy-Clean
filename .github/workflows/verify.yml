name: Verify F1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore shared Dart contracts
        working-directory: packages/contracts
        run: dart pub get --enforce-lockfile
      - name: Check shared Dart contracts
        working-directory: packages/contracts
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test
      - name: Restore Mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Check Mobile
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
      - name: Build Android from clean checkout
        working-directory: apps/mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: helpy-mobile-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
